<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek Harness 一次 turn 的数据流</title>
  <desc id="desc">展示从用户输入、提示词与工具装配、模型流式响应、工具执行到会话事件日志和下一步请求的关系。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style>
      .title { font: 700 34px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB",Arial,sans-serif; fill:#0f172a; }
      .subtitle { font: 400 17px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB",Arial,sans-serif; fill:#64748b; }
      .label { font: 700 17px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB",Arial,sans-serif; fill:#0f172a; }
      .body { font: 400 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB",Arial,sans-serif; fill:#475569; }
      .mono { font: 600 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill:#334155; }
      .small { font: 400 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB",Arial,sans-serif; fill:#64748b; }
    </style>
  </defs>

  <rect width="1440" height="820" fill="#ffffff"/>
  <rect x="42" y="38" width="1356" height="744" rx="28" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="82" y="96" class="title">从输入到可恢复结果：一个 turn 如何运行</text>
  <text x="82" y="128" class="subtitle">DeepSeek Harness 把模型调用、工具执行和持久化事件放进同一条可观察的生命周期。</text>

  <rect x="82" y="164" width="1276" height="42" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="105" y="191" class="mono">durable session events</text>
  <text x="330" y="191" class="body">turn/start · step/start · user/message · assistant/chunk · assistant/message · tool/call · tool/result · step/end · turn/end</text>

  <g filter="url(#shadow)">
    <rect x="82" y="246" width="188" height="126" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="106" y="281" class="label">1  输入进入 inbox</text>
    <text x="106" y="310" class="mono">turn/start</text>
    <text x="106" y="337" class="body">claim next-step input</text>
    <text x="106" y="360" class="body">+ queued message</text>

    <rect x="314" y="246" width="214" height="126" rx="18" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="338" y="281" class="label">2  装配可见上下文</text>
    <text x="338" y="310" class="mono">agent/pre-step</text>
    <text x="338" y="337" class="body">prompt sections</text>
    <text x="338" y="360" class="body">+ scoped tool schemas</text>

    <rect x="572" y="246" width="196" height="126" rx="18" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="596" y="281" class="label">3  固化请求</text>
    <text x="596" y="310" class="mono">agent/request</text>
    <text x="596" y="337" class="body">provider / model</text>
    <text x="596" y="360" class="body">messages / signal</text>

    <rect x="812" y="246" width="214" height="126" rx="18" fill="#ffffff" stroke="#93c5fd"/>
    <text x="836" y="281" class="label">4  流式模型调用</text>
    <text x="836" y="310" class="mono">llm/stream</text>
    <text x="836" y="337" class="body">assistant/chunk*</text>
    <text x="836" y="360" class="body">idle timeout / abort</text>

    <rect x="1070" y="246" width="288" height="126" rx="18" fill="#ffffff" stroke="#86efac"/>
    <text x="1094" y="281" class="label">5  组装 assistant message</text>
    <text x="1094" y="310" class="mono">assistant/message</text>
    <text x="1094" y="337" class="body">无 tool-call → completed</text>
    <text x="1094" y="360" class="body">有 tool-call → 进入执行链</text>
  </g>

  <path d="M270 309 H304" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M528 309 H562" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M768 309 H802" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1026 309 H1060" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="180" y="470" width="246" height="126" rx="18" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="204" y="505" class="label">6  tools/pre-execute</text>
    <text x="204" y="534" class="body">权限、参数、执行前拦截</text>
    <text x="204" y="561" class="mono">tool/call*</text>
    <text x="204" y="584" class="body">每个调用保持可追踪</text>

    <rect x="492" y="470" width="246" height="126" rx="18" fill="#fff7ed" stroke="#fdba74"/>
    <text x="516" y="505" class="label">7  tools/execute</text>
    <text x="516" y="534" class="body">Bash / FS / Web / PTY</text>
    <text x="516" y="561" class="body">可换 provider 的执行世界</text>
    <text x="516" y="584" class="mono">tools/post-execute</text>

    <rect x="804" y="470" width="246" height="126" rx="18" fill="#ecfdf5" stroke="#86efac"/>
    <text x="828" y="505" class="label">8  tool/result*</text>
    <text x="828" y="534" class="body">结果写入 session log</text>
    <text x="828" y="561" class="body">并投影到下一次请求</text>
    <text x="828" y="584" class="body">失败、取消也有原因</text>

    <rect x="1116" y="470" width="242" height="126" rx="18" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="1140" y="505" class="label">9  step / turn 结束</text>
    <text x="1140" y="534" class="mono">step/end → turn/end</text>
    <text x="1140" y="561" class="body">仍有 next-step？继续</text>
    <text x="1140" y="584" class="body">否则归档本轮结果</text>
  </g>

  <path d="M1214 372 V430 H303 V460" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M426 533 H482" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M738 533 H794" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1050 533 H1106" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1116 610 C1010 690 460 690 303 610 V605" fill="none" stroke="#a78bfa" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <text x="650" y="714" class="small">下一步输入或工具结果会重新进入 claim → prompt/tool schema → model request</text>

  <rect x="82" y="742" width="1276" height="1" fill="#e2e8f0"/>
  <text x="82" y="765" class="small">关键不变量：模型能看到的内容必须能从日志重建；live extension point 负责拦截与替换，durable event 负责恢复与回放。</text>
</svg>
