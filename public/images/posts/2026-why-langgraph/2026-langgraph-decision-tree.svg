<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1160" viewBox="0 0 1200 1160" role="img" aria-labelledby="title desc">
<title id="title">Agent 实现入口选择</title><desc id="desc">先判断现成产品和既有编排，再选择 LangChain 现成循环或 LangGraph 自定义工作流。Checkpoint 不要求创建 Agent。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#64748b"/></marker></defs>
<rect width="1200" height="1160" rx="24" fill="#f7f5ef"/>
<g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif">
<text x="70" y="74" font-size="34" font-weight="700" fill="#172033">先选择实现入口，再决定是否自定义工作流</text>
<text x="70" y="115" font-size="20" fill="#64748b">LangChain / LangGraph · 2026-09-10 更新</text>
<rect x="65" y="155" width="1070" height="175" rx="18" fill="white" stroke="#cbd5e1"/>
<text x="90" y="198" font-size="23" fill="#0f766e" font-weight="700">01</text>
<text x="145" y="198" font-size="26" fill="#172033" font-weight="600">现成 Agent 产品满足任务与接入要求？</text>
<text x="145" y="249" font-size="23" fill="#0f766e">是 → 使用现成产品</text>
<text x="145" y="294" font-size="23" fill="#475569">否 → 继续判断</text>
<path d="M600 334 V364" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="65" y="370" width="1070" height="175" rx="18" fill="white" stroke="#cbd5e1"/>
<text x="90" y="413" font-size="23" fill="#0f766e" font-weight="700">02</text>
<text x="145" y="413" font-size="26" fill="#172033" font-weight="600">普通代码或现有后端已能管理流程？</text>
<text x="145" y="464" font-size="23" fill="#0f766e">是 → 保留编排，按需加入模型 / LCEL</text>
<text x="145" y="509" font-size="23" fill="#475569">否 → 继续判断</text>
<path d="M600 549 V579" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="65" y="585" width="1070" height="175" rx="18" fill="white" stroke="#cbd5e1"/>
<text x="90" y="628" font-size="23" fill="#0f766e" font-weight="700">03</text>
<text x="145" y="628" font-size="26" fill="#172033" font-weight="600">create_agent + middleware 能清楚表达？</text>
<text x="145" y="679" font-size="23" fill="#0f766e">是 → LangChain，按需配置 checkpointer</text>
<text x="145" y="724" font-size="23" fill="#475569">否 → 自定义执行流程</text>
<path d="M600 764 V794" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="65" y="800" width="1070" height="175" rx="18" fill="white" stroke="#cbd5e1"/>
<text x="90" y="843" font-size="23" fill="#0f766e" font-weight="700">04</text>
<text x="145" y="843" font-size="26" fill="#172033" font-weight="600">需要运行时管理自己的步骤与恢复？</text>
<text x="145" y="894" font-size="23" fill="#0f766e">共享状态、节点、边 → StateGraph</text>
<text x="145" y="939" font-size="23" fill="#475569">函数、if / for、task → Functional API</text>
<text x="70" y="1065" font-size="23" fill="#172033">Checkpoint 不要求 Agent；普通 LCEL 不会自动获得断点恢复。</text>
<text x="70" y="1104" font-size="20" fill="#64748b">入口可以组合：外层 LangGraph 工作流，内层 LangChain Agent。</text>
</g></svg>
