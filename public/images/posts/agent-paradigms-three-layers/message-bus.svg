<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img"><title>04 / Message bus：用事件连接处理者</title><desc>文档任务示例；总线按主题把消息交给订阅者</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#547080"/></marker></defs><rect width="1000" height="610" rx="20" fill="#f5f7fa"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="47" font-size="27" font-weight="700" fill="#182b3a">04 / Message bus：用事件连接处理者</text><text x="40" y="79" font-size="17" fill="#536677">文档任务示例；总线按主题把消息交给订阅者</text><rect x="40" y="120" width="260" height="80" rx="12" fill="#fff0d4" stroke="#adbdca"/><text x="170.0" y="155.0" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">接口变更事件</text><text x="170.0" y="183.0" text-anchor="middle" font-size="16" fill="#536677">api.changed</text><rect x="410" y="120" width="545" height="80" rx="12" fill="#e2edf9" stroke="#adbdca"/><text x="682.5" y="155.0" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">消息总线 / 主题路由</text><text x="682.5" y="183.0" text-anchor="middle" font-size="16" fill="#536677">接收发布 · 向匹配订阅者投递</text><polyline points="300,160 410,160" fill="none" stroke="#547080" stroke-width="2.4" marker-end="url(#arrow)"/><text x="355" y="145" text-anchor="middle" font-size="16" fill="#536677">发布</text><rect x="100" y="320" width="300" height="90" rx="12" fill="#def1e8" stroke="#adbdca"/><text x="250.0" y="360.0" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">内容 Agent</text><text x="250.0" y="388.0" text-anchor="middle" font-size="16" fill="#536677">订阅 api.changed</text><rect x="620" y="320" width="300" height="90" rx="12" fill="#eae4f7" stroke="#adbdca"/><text x="770.0" y="360.0" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">校验 Agent</text><text x="770.0" y="388.0" text-anchor="middle" font-size="16" fill="#536677">订阅 draft.updated</text><polyline points="550,200 550,260 250,260 250,320" fill="none" stroke="#547080" stroke-width="2.4" marker-end="url(#arrow)"/><text x="310" y="247" text-anchor="middle" font-size="16" fill="#536677">投递接口变更</text><polyline points="400,355 470,355 470,200" fill="none" stroke="#547080" stroke-width="2.4" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="445" y="430" text-anchor="middle" font-size="16" fill="#536677">发布 draft.updated</text><polyline points="815,200 815,320" fill="none" stroke="#547080" stroke-width="2.4" marker-end="url(#arrow)"/><text x="890" y="267" text-anchor="middle" font-size="16" fill="#536677">投递草稿更新</text><rect x="620" y="485" width="300" height="65" rx="12" fill="#fff0d4" stroke="#adbdca"/><text x="770.0" y="512.5" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">校验结果事件</text><text x="770.0" y="540.5" text-anchor="middle" font-size="16" fill="#536677">validation.completed</text><polyline points="770,410 770,485" fill="none" stroke="#547080" stroke-width="2.4" marker-end="url(#arrow)"/><text x="330" y="540" text-anchor="middle" font-size="16" fill="#536677">每个事件关联同一任务与文档版本</text><text x="500" y="587" text-anchor="middle" font-size="16" fill="#536677">处理者增加时扩展订阅；投递成功与业务完成是不同状态</text></g></svg>