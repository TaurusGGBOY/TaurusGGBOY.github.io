<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img"><title>03 / Agent teams：成员跨任务持续工作</title><desc>用长期上下文承担独立分区；队列记录任务归属和完成状态</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#547080"/></marker></defs><rect width="1000" height="610" rx="20" fill="#f5f7fa"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="47" font-size="27" font-weight="700" fill="#182b3a">03 / Agent teams：成员跨任务持续工作</text><text x="40" y="79" font-size="17" fill="#536677">用长期上下文承担独立分区；队列记录任务归属和完成状态</text><rect x="45" y="125" width="230" height="80" rx="12" fill="#e2edf9" stroke="#adbdca"/><text x="160.0" y="160.0" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">Coordinator</text><text x="160.0" y="188.0" text-anchor="middle" font-size="16" fill="#536677">分区与整体交付</text><rect x="405" y="125" width="540" height="80" rx="12" fill="#fff0d4" stroke="#adbdca"/><text x="675.0" y="160.0" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">共享任务队列</text><text x="675.0" y="188.0" text-anchor="middle" font-size="16" fill="#536677">待领取 → 处理中 → 完成</text><polyline marker-start="url(#arrow)" points="275,165 405,165" fill="none" stroke="#547080" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="60" y="315" width="220" height="95" rx="12" fill="#def1e8" stroke="#adbdca"/><text x="170.0" y="357.5" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">Teammate A</text><text x="170.0" y="385.5" text-anchor="middle" font-size="16" fill="#536677">Python 文档</text><polyline points="675,205 675,255 170,255 170,315" fill="none" stroke="#547080" stroke-width="2.4" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="60" y="450" width="220" height="65" rx="12" fill="#e2edf9" stroke="#adbdca"/><text x="170.0" y="477.5" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">任务 1 → 任务 2</text><text x="170.0" y="505.5" text-anchor="middle" font-size="16" fill="#536677">上下文继续保留</text><polyline points="170,410 170,450" fill="none" stroke="#547080" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="390" y="315" width="220" height="95" rx="12" fill="#def1e8" stroke="#adbdca"/><text x="500.0" y="357.5" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">Teammate B</text><text x="500.0" y="385.5" text-anchor="middle" font-size="16" fill="#536677">Java 文档</text><polyline points="675,205 675,255 500,255 500,315" fill="none" stroke="#547080" stroke-width="2.4" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="390" y="450" width="220" height="65" rx="12" fill="#e2edf9" stroke="#adbdca"/><text x="500.0" y="477.5" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">任务 1 → 任务 2</text><text x="500.0" y="505.5" text-anchor="middle" font-size="16" fill="#536677">上下文继续保留</text><polyline points="500,410 500,450" fill="none" stroke="#547080" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="720" y="315" width="220" height="95" rx="12" fill="#def1e8" stroke="#adbdca"/><text x="830.0" y="357.5" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">Teammate C</text><text x="830.0" y="385.5" text-anchor="middle" font-size="16" fill="#536677">Go 文档</text><polyline points="675,205 675,255 830,255 830,315" fill="none" stroke="#547080" stroke-width="2.4" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="720" y="450" width="220" height="65" rx="12" fill="#e2edf9" stroke="#adbdca"/><text x="830.0" y="477.5" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">任务 1 → 任务 2</text><text x="830.0" y="505.5" text-anchor="middle" font-size="16" fill="#536677">上下文继续保留</text><polyline points="830,410 830,450" fill="none" stroke="#547080" stroke-width="2.4" marker-end="url(#arrow)"/><text x="500" y="560" text-anchor="middle" font-size="16" fill="#536677">成员仍在工作 ≠ 所有任务完成；完成状态需要与实际产物对应</text><text x="500" y="592" text-anchor="middle" font-size="16" fill="#536677">图省略成员通信；具体产品可以支持直接消息</text></g></svg>