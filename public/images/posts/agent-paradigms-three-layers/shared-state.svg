<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="630" viewBox="0 0 1000 630" role="img"><title>05 / Shared state：通过累积事实协作</title><desc>Agent 直接读写持久化资料；存储层与停止规则仍需设计</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#547080"/></marker></defs><rect width="1000" height="630" rx="20" fill="#f5f7fa"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="47" font-size="27" font-weight="700" fill="#182b3a">05 / Shared state：通过累积事实协作</text><text x="40" y="79" font-size="17" fill="#536677">Agent 直接读写持久化资料；存储层与停止规则仍需设计</text><rect x="330" y="260" width="340" height="100" rx="12" fill="#fff0d4" stroke="#adbdca"/><text x="500.0" y="305.0" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">共享状态库</text><text x="500.0" y="333.0" text-anchor="middle" font-size="16" fill="#536677">事实 · 来源 · 版本 · 待验证项</text><rect x="35" y="120" width="260" height="85" rx="12" fill="#def1e8" stroke="#adbdca"/><text x="165.0" y="157.5" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">接口 Agent</text><text x="165.0" y="185.5" text-anchor="middle" font-size="16" fill="#536677">写入字段变化</text><rect x="705" y="120" width="260" height="85" rx="12" fill="#def1e8" stroke="#adbdca"/><text x="835.0" y="157.5" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">示例 Agent</text><text x="835.0" y="185.5" text-anchor="middle" font-size="16" fill="#536677">读取变化并验证</text><rect x="35" y="430" width="260" height="85" rx="12" fill="#def1e8" stroke="#adbdca"/><text x="165.0" y="467.5" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">迁移 Agent</text><text x="165.0" y="495.5" text-anchor="middle" font-size="16" fill="#536677">补充使用影响</text><rect x="705" y="430" width="260" height="85" rx="12" fill="#def1e8" stroke="#adbdca"/><text x="835.0" y="467.5" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">资料 Agent</text><text x="835.0" y="495.5" text-anchor="middle" font-size="16" fill="#536677">补齐来源与边界</text><polyline points="220,205 330,280" fill="none" stroke="#547080" stroke-width="2.4" marker-end="url(#arrow)" marker-start="url(#arrow)"/><polyline points="780,205 670,280" fill="none" stroke="#547080" stroke-width="2.4" marker-end="url(#arrow)" marker-start="url(#arrow)"/><polyline points="220,430 330,340" fill="none" stroke="#547080" stroke-width="2.4" marker-end="url(#arrow)" marker-start="url(#arrow)"/><polyline points="780,430 670,340" fill="none" stroke="#547080" stroke-width="2.4" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="500" y="228" text-anchor="middle" font-size="16" fill="#536677">初始化：写入问题、范围与已有资料</text><text x="500" y="405" text-anchor="middle" font-size="16" fill="#536677">双向箭头：读取已有发现，写回新增证据</text><text x="500" y="567" text-anchor="middle" font-size="16" fill="#536677">停止：达到交付条件，或预算耗尽后明确报告缺口</text><text x="500" y="602" text-anchor="middle" font-size="16" fill="#536677">Agent 退出后事实仍可保留；存储可用性要另行保证</text></g></svg>