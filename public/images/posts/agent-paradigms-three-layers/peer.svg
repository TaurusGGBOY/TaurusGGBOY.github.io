<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img"><title>08 / Peer-to-Peer：由参与者直接交接</title><desc>通用弱中心化示意；Swarm 的具体语义取决于实现</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#547080"/></marker></defs><rect width="1000" height="480" rx="20" fill="#f5f7fa"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="47" font-size="27" font-weight="700" fill="#182b3a">08 / Peer-to-Peer：由参与者直接交接</text><text x="40" y="79" font-size="17" fill="#536677">通用弱中心化示意；Swarm 的具体语义取决于实现</text><rect x="90" y="165" width="230" height="85" rx="12" fill="#e2edf9" stroke="#adbdca"/><text x="205.0" y="214.5" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">Agent A</text><rect x="680" y="165" width="230" height="85" rx="12" fill="#e2edf9" stroke="#adbdca"/><text x="795.0" y="214.5" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">Agent B</text><rect x="385" y="340" width="230" height="85" rx="12" fill="#e2edf9" stroke="#adbdca"/><text x="500.0" y="389.5" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">Agent C</text><polyline points="320,205 680,205" fill="none" stroke="#547080" stroke-width="2.4" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="500" y="185" text-anchor="middle" font-size="16" fill="#536677">直接交接</text><polyline points="220,250 435,340" fill="none" stroke="#547080" stroke-width="2.4" marker-end="url(#arrow)" marker-start="url(#arrow)"/><polyline points="780,250 565,340" fill="none" stroke="#547080" stroke-width="2.4" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="500" y="125" text-anchor="middle" font-size="16" fill="#536677">没有在图中设置固定的中央调度者</text><text x="500" y="459" text-anchor="middle" font-size="16" fill="#536677">需要跟踪当前负责人，避免同一任务被来回转交</text></g></svg>