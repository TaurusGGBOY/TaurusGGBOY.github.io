<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1470" viewBox="0 0 1000 1470" role="img"><title>06 / Multi-agent 选型决策树</title><desc>先选当前主要瓶颈对应的起点，再决定是否组合其他模式</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#547080"/></marker></defs><rect width="1000" height="1470" rx="20" fill="#f5f7fa"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="47" font-size="27" font-weight="700" fill="#182b3a">06 / Multi-agent 选型决策树</text><text x="40" y="79" font-size="17" fill="#536677">先选当前主要瓶颈对应的起点，再决定是否组合其他模式</text><rect x="40" y="125" width="495" height="95" rx="12" fill="#ffffff" stroke="#adbdca"/><text x="287.5" y="167.5" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">单 Agent 或固定工作流</text><text x="287.5" y="195.5" text-anchor="middle" font-size="16" fill="#536677">已经能满足交付要求？</text><rect x="635" y="125" width="330" height="95" rx="12" fill="#eef1f5" stroke="#adbdca"/><text x="800.0" y="167.5" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">保留简单方案</text><text x="800.0" y="195.5" text-anchor="middle" font-size="16" fill="#536677">无需增加协调层</text><polyline points="535,172 635,172" fill="none" stroke="#547080" stroke-width="2.4" marker-end="url(#arrow)"/><text x="585" y="157" text-anchor="middle" font-size="16" fill="#536677">是</text><polyline points="287,220 287,300" fill="none" stroke="#547080" stroke-width="2.4" marker-end="url(#arrow)"/><text x="312" y="264" text-anchor="middle" font-size="16" fill="#536677">否</text><rect x="40" y="300" width="495" height="95" rx="12" fill="#ffffff" stroke="#adbdca"/><text x="287.5" y="342.5" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">主要缺口是输出验收，</text><text x="287.5" y="370.5" text-anchor="middle" font-size="16" fill="#536677">而且评价标准能够明确？</text><rect x="635" y="300" width="330" height="95" rx="12" fill="#eae4f7" stroke="#adbdca"/><text x="800.0" y="342.5" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">Generator-verifier</text><text x="800.0" y="370.5" text-anchor="middle" font-size="16" fill="#536677">先补齐验证与反馈循环</text><polyline points="535,347 635,347" fill="none" stroke="#547080" stroke-width="2.4" marker-end="url(#arrow)"/><text x="585" y="332" text-anchor="middle" font-size="16" fill="#536677">是</text><polyline points="287,395 287,475" fill="none" stroke="#547080" stroke-width="2.4" marker-end="url(#arrow)"/><text x="312" y="439" text-anchor="middle" font-size="16" fill="#536677">否</text><rect x="40" y="475" width="495" height="95" rx="12" fill="#ffffff" stroke="#adbdca"/><text x="287.5" y="517.5" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">成员需要反复利用彼此的新发现，</text><text x="287.5" y="545.5" text-anchor="middle" font-size="16" fill="#536677">共同维护一份累积知识？</text><rect x="635" y="475" width="330" height="95" rx="12" fill="#fff0d4" stroke="#adbdca"/><text x="800.0" y="517.5" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">Shared state</text><text x="800.0" y="545.5" text-anchor="middle" font-size="16" fill="#536677">事实、来源与版本共同维护</text><polyline points="535,522 635,522" fill="none" stroke="#547080" stroke-width="2.4" marker-end="url(#arrow)"/><text x="585" y="507" text-anchor="middle" font-size="16" fill="#536677">是</text><polyline points="287,570 287,650" fill="none" stroke="#547080" stroke-width="2.4" marker-end="url(#arrow)"/><text x="312" y="614" text-anchor="middle" font-size="16" fill="#536677">否</text><rect x="40" y="650" width="495" height="95" rx="12" fill="#ffffff" stroke="#adbdca"/><text x="287.5" y="692.5" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">后续工作主要由事件触发，</text><text x="287.5" y="720.5" text-anchor="middle" font-size="16" fill="#536677">且处理者需要持续扩展？</text><rect x="635" y="650" width="330" height="95" rx="12" fill="#e2edf9" stroke="#adbdca"/><text x="800.0" y="692.5" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">Message bus</text><text x="800.0" y="720.5" text-anchor="middle" font-size="16" fill="#536677">按主题发布、订阅与投递</text><polyline points="535,697 635,697" fill="none" stroke="#547080" stroke-width="2.4" marker-end="url(#arrow)"/><text x="585" y="682" text-anchor="middle" font-size="16" fill="#536677">是</text><polyline points="287,745 287,825" fill="none" stroke="#547080" stroke-width="2.4" marker-end="url(#arrow)"/><text x="312" y="789" text-anchor="middle" font-size="16" fill="#536677">否</text><rect x="40" y="825" width="495" height="95" rx="12" fill="#ffffff" stroke="#adbdca"/><text x="287.5" y="867.5" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">能划出相对独立的范围，</text><text x="287.5" y="895.5" text-anchor="middle" font-size="16" fill="#536677">并定义每项任务的交付物？</text><rect x="635" y="825" width="330" height="95" rx="12" fill="#eef1f5" stroke="#adbdca"/><text x="800.0" y="867.5" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">先重新划分任务</text><text x="800.0" y="895.5" text-anchor="middle" font-size="16" fill="#536677">依赖过密时试用单 Agent</text><polyline points="535,872 635,872" fill="none" stroke="#547080" stroke-width="2.4" marker-end="url(#arrow)"/><text x="585" y="857" text-anchor="middle" font-size="16" fill="#536677">否</text><polyline points="287,920 287,1000" fill="none" stroke="#547080" stroke-width="2.4" marker-end="url(#arrow)"/><text x="312" y="964" text-anchor="middle" font-size="16" fill="#536677">是</text><rect x="40" y="1000" width="495" height="95" rx="12" fill="#ffffff" stroke="#adbdca"/><text x="287.5" y="1042.5" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">成员需要跨多个任务</text><text x="287.5" y="1070.5" text-anchor="middle" font-size="16" fill="#536677">持续保留同一领域的上下文？</text><rect x="635" y="1000" width="330" height="95" rx="12" fill="#def1e8" stroke="#adbdca"/><text x="800.0" y="1042.5" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">Agent teams</text><text x="800.0" y="1070.5" text-anchor="middle" font-size="16" fill="#536677">长期成员承担独立分区</text><polyline points="535,1047 635,1047" fill="none" stroke="#547080" stroke-width="2.4" marker-end="url(#arrow)"/><text x="585" y="1032" text-anchor="middle" font-size="16" fill="#536677">是</text><polyline points="287,1095 287,1175" fill="none" stroke="#547080" stroke-width="2.4" marker-end="url(#arrow)"/><text x="312" y="1139" text-anchor="middle" font-size="16" fill="#536677">否</text><rect x="100" y="1175" width="375" height="90" rx="12" fill="#def1e8" stroke="#adbdca"/><text x="287.5" y="1215.0" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">Orchestrator-subagent</text><text x="287.5" y="1243.0" text-anchor="middle" font-size="16" fill="#536677">边界明确的一次性委派</text><text x="730" y="1222" text-anchor="middle" font-size="16" fill="#536677">叶子表示优先尝试的起点</text><rect x="40" y="1320" width="925" height="115" rx="12" fill="#eae4f7"/><text x="500" y="1355" text-anchor="middle" font-size="16" fill="#536677">组合规则：任何主模式都可以叠加 Generator-verifier 做产物验收</text><text x="500" y="1388" text-anchor="middle" font-size="16" fill="#536677">事件与共享知识同时重要：Message bus 触发动作，Shared state 保存事实</text><text x="500" y="1420" text-anchor="middle" font-size="16" fill="#536677">决策树为本文的工程整理，分支顺序不表示官方优先级或能力高低</text></g></svg>