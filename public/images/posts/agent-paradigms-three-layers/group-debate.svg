<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img"><title>07 / Group Chat 与 Debate：共享讨论，带反馈修订</title><desc>通用协作示意；下半部分画出辩论中的一种反馈循环</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#547080"/></marker></defs><rect width="1000" height="590" rx="20" fill="#f5f7fa"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="47" font-size="27" font-weight="700" fill="#182b3a">07 / Group Chat 与 Debate：共享讨论，带反馈修订</text><text x="40" y="79" font-size="17" fill="#536677">通用协作示意；下半部分画出辩论中的一种反馈循环</text><rect x="340" y="125" width="320" height="80" rx="12" fill="#eae4f7" stroke="#adbdca"/><text x="500.0" y="160.0" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">共享会话与管理器</text><text x="500.0" y="188.0" text-anchor="middle" font-size="16" fill="#536677">选择下一位发言者</text><rect x="45" y="285" width="220" height="65" rx="12" fill="#e2edf9" stroke="#adbdca"/><text x="155.0" y="324.5" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">专家 A</text><polyline points="500,205 500,245 155,245 155,285" fill="none" stroke="#547080" stroke-width="2.4" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="390" y="285" width="220" height="65" rx="12" fill="#e2edf9" stroke="#adbdca"/><text x="500.0" y="324.5" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">专家 B</text><polyline points="500,205 500,245 500,245 500,285" fill="none" stroke="#547080" stroke-width="2.4" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="735" y="285" width="220" height="65" rx="12" fill="#e2edf9" stroke="#adbdca"/><text x="845.0" y="324.5" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">专家 C</text><polyline points="500,205 500,245 845,245 845,285" fill="none" stroke="#547080" stroke-width="2.4" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="500" y="390" text-anchor="middle" font-size="16" fill="#536677">Debate 可为参与者设置提出、质疑、裁决等职责</text><rect x="45" y="430" width="220" height="65" rx="12" fill="#def1e8" stroke="#adbdca"/><text x="155.0" y="469.5" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">提出方案</text><rect x="390" y="430" width="220" height="65" rx="12" fill="#def1e8" stroke="#adbdca"/><text x="500.0" y="469.5" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">质疑证据</text><rect x="735" y="430" width="220" height="65" rx="12" fill="#def1e8" stroke="#adbdca"/><text x="845.0" y="469.5" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">裁决结果</text><polyline points="265,463 390,463" fill="none" stroke="#547080" stroke-width="2.4" marker-end="url(#arrow)"/><polyline points="610,463 735,463" fill="none" stroke="#547080" stroke-width="2.4" marker-end="url(#arrow)"/><polyline points="845,495 845,540 155,540 155,495" fill="none" stroke="#547080" stroke-width="2.4" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="500" y="566" text-anchor="middle" font-size="16" fill="#536677">需要修改：带具体反馈返回</text></g></svg>