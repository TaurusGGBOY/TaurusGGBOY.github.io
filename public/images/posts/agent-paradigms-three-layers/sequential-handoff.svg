<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="515" viewBox="0 0 1000 515" role="img"><title>05 / Sequential 与 Handoff：顺序固定，或途中交接</title><desc>通用协作示意；箭头上标明交接的含义</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#547080"/></marker></defs><rect width="1000" height="515" rx="20" fill="#f5f7fa"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="47" font-size="27" font-weight="700" fill="#182b3a">05 / Sequential 与 Handoff：顺序固定，或途中交接</text><text x="40" y="79" font-size="17" fill="#536677">通用协作示意；箭头上标明交接的含义</text><text x="150" y="135" text-anchor="middle" font-size="16" fill="#536677">Sequential：预定顺序</text><rect x="45" y="160" width="220" height="75" rx="12" fill="#e2edf9" stroke="#adbdca"/><text x="155.0" y="204.5" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">研究 Agent</text><rect x="390" y="160" width="220" height="75" rx="12" fill="#e2edf9" stroke="#adbdca"/><text x="500.0" y="204.5" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">写作 Agent</text><rect x="735" y="160" width="220" height="75" rx="12" fill="#e2edf9" stroke="#adbdca"/><text x="845.0" y="204.5" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">审核 Agent</text><polyline points="265,198 390,198" fill="none" stroke="#547080" stroke-width="2.4" marker-end="url(#arrow)"/><text x="327" y="185" text-anchor="middle" font-size="16" fill="#536677">材料</text><polyline points="610,198 735,198" fill="none" stroke="#547080" stroke-width="2.4" marker-end="url(#arrow)"/><text x="672" y="185" text-anchor="middle" font-size="16" fill="#536677">草稿</text><text x="150" y="310" text-anchor="middle" font-size="16" fill="#536677">Handoff：按发现交接</text><rect x="45" y="340" width="220" height="75" rx="12" fill="#e2edf9" stroke="#adbdca"/><text x="155.0" y="384.5" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">接待 Agent</text><rect x="390" y="340" width="220" height="75" rx="12" fill="#e2edf9" stroke="#adbdca"/><text x="500.0" y="384.5" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">技术 Agent</text><rect x="735" y="340" width="220" height="75" rx="12" fill="#def1e8" stroke="#adbdca"/><text x="845.0" y="372.5" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">后续对话</text><text x="845.0" y="400.5" text-anchor="middle" font-size="16" fill="#536677"></text><polyline points="265,378 390,378" fill="none" stroke="#547080" stroke-width="2.4" marker-end="url(#arrow)"/><text x="327" y="365" text-anchor="middle" font-size="16" fill="#536677">转移处理权</text><polyline points="610,378 735,378" fill="none" stroke="#547080" stroke-width="2.4" marker-end="url(#arrow)"/><text x="500" y="470" text-anchor="middle" font-size="16" fill="#536677">交接时应说明：已知事实、未完成事项、接下来由谁负责</text></g></svg>