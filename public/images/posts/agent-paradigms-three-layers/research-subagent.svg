<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img"><title>02 / Subagent：检索与判断形成循环</title><desc>原文机制示意；网页材料留在各自的上下文中</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#547080"/></marker></defs><rect width="1000" height="430" rx="20" fill="#f5f7fa"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="47" font-size="27" font-weight="700" fill="#182b3a">02 / Subagent：检索与判断形成循环</text><text x="40" y="79" font-size="17" fill="#536677">原文机制示意；网页材料留在各自的上下文中</text><rect x="40" y="165" width="200" height="90" rx="12" fill="#def1e8" stroke="#adbdca"/><text x="140.0" y="205.0" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">接收子任务</text><text x="140.0" y="233.0" text-anchor="middle" font-size="16" fill="#536677">目标与范围</text><rect x="280" y="165" width="200" height="90" rx="12" fill="#def1e8" stroke="#adbdca"/><text x="380.0" y="205.0" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">检索工具</text><text x="380.0" y="233.0" text-anchor="middle" font-size="16" fill="#536677">搜索与阅读</text><rect x="520" y="165" width="200" height="90" rx="12" fill="#def1e8" stroke="#adbdca"/><text x="620.0" y="205.0" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">检查发现</text><text x="620.0" y="233.0" text-anchor="middle" font-size="16" fill="#536677">证据与缺口</text><rect x="760" y="165" width="200" height="90" rx="12" fill="#def1e8" stroke="#adbdca"/><text x="860.0" y="205.0" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">返回结果</text><text x="860.0" y="233.0" text-anchor="middle" font-size="16" fill="#536677">摘要与来源</text><polyline points="240,210 280,210" fill="none" stroke="#547080" stroke-width="2.4" marker-end="url(#arrow)"/><polyline points="480,210 520,210" fill="none" stroke="#547080" stroke-width="2.4" marker-end="url(#arrow)"/><polyline points="720,210 760,210" fill="none" stroke="#547080" stroke-width="2.4" marker-end="url(#arrow)"/><polyline points="620,255 620,325 380,325 380,255" fill="none" stroke="#547080" stroke-width="2.4" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="500" y="357" text-anchor="middle" font-size="16" fill="#536677">仍有缺口：修改查询</text><text x="500" y="397" text-anchor="middle" font-size="16" fill="#536677">结束条件由任务要求决定；完成搜索不等于已回答问题</text></g></svg>