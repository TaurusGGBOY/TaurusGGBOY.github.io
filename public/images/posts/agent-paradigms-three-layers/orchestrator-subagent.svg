<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img"><title>02 / Orchestrator-subagent：一次委派，一份结果</title><desc>关注边界清楚的子任务；图中双向箭头表示委派与回报</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#547080"/></marker></defs><rect width="1000" height="550" rx="20" fill="#f5f7fa"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40" y="47" font-size="27" font-weight="700" fill="#182b3a">02 / Orchestrator-subagent：一次委派，一份结果</text><text x="40" y="79" font-size="17" fill="#536677">关注边界清楚的子任务；图中双向箭头表示委派与回报</text><rect x="350" y="120" width="300" height="85" rx="12" fill="#e2edf9" stroke="#adbdca"/><text x="500.0" y="157.5" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">Orchestrator</text><text x="500.0" y="185.5" text-anchor="middle" font-size="16" fill="#536677">拆分任务 · 综合判断</text><rect x="735" y="120" width="220" height="85" rx="12" fill="#fff0d4" stroke="#adbdca"/><text x="845.0" y="157.5" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">主 Agent 自己处理</text><text x="845.0" y="185.5" text-anchor="middle" font-size="16" fill="#536677">编辑与整体验证</text><polyline points="650,163 735,163" fill="none" stroke="#547080" stroke-width="2.4" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="60" y="320" width="220" height="90" rx="12" fill="#def1e8" stroke="#adbdca"/><text x="170.0" y="360.0" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">Subagent A</text><text x="170.0" y="388.0" text-anchor="middle" font-size="16" fill="#536677">检查接口字段</text><polyline points="500,205 500,260 170,260 170,320" fill="none" stroke="#547080" stroke-width="2.4" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="390" y="320" width="220" height="90" rx="12" fill="#def1e8" stroke="#adbdca"/><text x="500.0" y="360.0" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">Subagent B</text><text x="500.0" y="388.0" text-anchor="middle" font-size="16" fill="#536677">检查示例代码</text><polyline points="500,205 500,260 500,260 500,320" fill="none" stroke="#547080" stroke-width="2.4" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="720" y="320" width="220" height="90" rx="12" fill="#def1e8" stroke="#adbdca"/><text x="830.0" y="360.0" text-anchor="middle" font-size="21" font-weight="600" fill="#182b3a">Subagent C</text><text x="830.0" y="388.0" text-anchor="middle" font-size="16" fill="#536677">检查文档链接</text><polyline points="500,205 500,260 830,260 830,320" fill="none" stroke="#547080" stroke-width="2.4" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="500" y="465" text-anchor="middle" font-size="16" fill="#536677">子任务返回：结果 + 证据位置 + 未解决项</text><text x="500" y="505" text-anchor="middle" font-size="16" fill="#536677">短任务在返回后结束；是否并行需要运行时明确安排</text></g></svg>