<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="840" viewBox="0 0 1120 840" role="img" aria-labelledby="title desc">
  <title id="title">YOCO 与 DeepSeek CED：全局资料怎样共享</title>
  <desc id="desc">左侧 YOCO 的前半段生成一套全局 KV，后半段各层用不同查询读取它。右侧 CED 的前二十层输出经投影产生全局 KV，再由 CSA2 按模式共享，后二十层还保留各自的局部窗口 KV。示意图省略专家网络等模块。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="none" stroke="#577589" stroke-width="1.6"/></marker>
  </defs>
  <rect width="1120" height="840" rx="24" fill="#f4f7fa"/>
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" fill="#18364a">
    <text x="48" y="60" font-size="30" font-weight="700">全局资料共享，逐层加工继续</text>
    <text x="48" y="95" font-size="18" fill="#526b7c">只画缓存的来源与复用关系，省略专家网络等模块</text>
    <rect x="36" y="126" width="512" height="634" rx="20" fill="#fff" stroke="#dce5ed"/>
    <rect x="572" y="126" width="512" height="634" rx="20" fill="#fff" stroke="#dce5ed"/>
    <text x="66" y="171" font-size="26" font-weight="700">YOCO</text>
    <text x="602" y="171" font-size="26" font-weight="700">DeepSeek CED + CSA2</text>
    <rect x="76" y="205" width="432" height="88" rx="12" fill="#e6f0fa"/>
    <text x="292" y="239" text-anchor="middle" font-size="22" font-weight="600">前半段：self-decoder</text>
    <text x="292" y="271" text-anchor="middle" font-size="18">高效注意力，保留有界状态</text>
    <path d="M292 295V333" stroke="#577589" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="112" y="350" width="360" height="88" rx="12" fill="#dff3ea" stroke="#87c6aa"/>
    <text x="292" y="385" text-anchor="middle" font-size="23" font-weight="600">一套共享的全局 KV</text>
    <text x="292" y="416" text-anchor="middle" font-size="18">由前半段最终输出生成</text>
    <path d="M292 440V483" stroke="#577589" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="76" y="500" width="432" height="139" rx="12" fill="#e6f0fa"/>
    <text x="292" y="537" text-anchor="middle" font-size="22" font-weight="600">后半段：cross-decoder</text>
    <text x="292" y="575" text-anchor="middle" font-size="20">各层用自己的 Q 查同一套 KV</text>
    <text x="292" y="610" text-anchor="middle" font-size="18">各层继续计算与加工</text>
    <text x="292" y="690" text-anchor="middle" font-size="19" fill="#526b7c">“Once” 指全局缓存跨层共享</text>
    <text x="292" y="722" text-anchor="middle" font-size="19" fill="#526b7c">新增 token 仍会更新状态</text>
    <rect x="612" y="205" width="432" height="88" rx="12" fill="#e6f0fa"/>
    <text x="828" y="239" text-anchor="middle" font-size="22" font-weight="600">前 20 层：因果编码器</text>
    <text x="828" y="271" text-anchor="middle" font-size="18">先处理输入，形成最终隐藏状态</text>
    <path d="M828 295V333" stroke="#577589" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="648" y="350" width="360" height="88" rx="12" fill="#dff3ea" stroke="#87c6aa"/>
    <text x="828" y="385" text-anchor="middle" font-size="23" font-weight="600">投影生成解码器全局 KV</text>
    <text x="828" y="416" text-anchor="middle" font-size="18">CSA2 按层的模式安排复用</text>
    <path d="M828 440V483" stroke="#577589" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="612" y="500" width="432" height="139" rx="12" fill="#e6f0fa"/>
    <text x="828" y="537" text-anchor="middle" font-size="22" font-weight="600">后 20 层：解码器</text>
    <text x="828" y="575" text-anchor="middle" font-size="20">各层查全局资料，继续加工</text>
    <rect x="638" y="591" width="380" height="35" rx="8" fill="#fff0d6"/>
    <text x="828" y="615" text-anchor="middle" font-size="18" fill="#795921">同时保留各层自己的局部 SWA KV</text>
    <text x="828" y="690" text-anchor="middle" font-size="19" fill="#526b7c">大段输入主要经过前半段</text>
    <text x="828" y="722" text-anchor="middle" font-size="19" fill="#526b7c">后半段局部状态通过短段重算准备</text>
    <text x="48" y="804" font-size="17" fill="#526b7c">依据：YOCO（2024）与 DeepSeek-V4.1-Flash 技术报告 §2.2–2.3；概念示意，非完整计算图。</text>
  </g>
</svg>
