<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030" role="img" aria-label="CUA-Universe 三阶段训练数据流水线"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" rx="24" fill="#f5f7fb"/><g font-family="system-ui,-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="55" y="65" font-size="35" font-weight="700" fill="#182a44">从真实软件到可训练的操作轨迹</text><rect x="55" y="120" width="1090" height="200" rx="18" fill="#eaf0ff" stroke="#dce4ee" stroke-width="2"/><text x="85" y="168" font-size="28" font-weight="650" fill="#526a88">01</text><text x="145" y="168" font-size="29" font-weight="650" fill="#182a44">App-Forge  /  构建环境与工具</text><text x="145" y="213" font-size="24" font-weight="400" fill="#182a44">安装与启动验证 → 可复现 VM</text><text x="145" y="248" font-size="24" font-weight="400" fill="#182a44">发现命令 / 包装 API / 生成 CLI</text><text x="145" y="283" font-size="24" font-weight="400" fill="#182a44">产物：共享 GUI+CLI 状态的应用环境</text><path d="M600,322 L600,354" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="55" y="360" width="1090" height="200" rx="18" fill="#e4f3ee" stroke="#dce4ee" stroke-width="2"/><text x="85" y="408" font-size="28" font-weight="650" fill="#526a88">02</text><text x="145" y="408" font-size="29" font-weight="650" fill="#182a44">Task-Weave  /  生成可执行任务</text><text x="145" y="453" font-size="24" font-weight="400" fill="#182a44">真实交互 → 可复用操作池</text><text x="145" y="488" font-size="24" font-weight="400" fill="#182a44">seed + 操作链 → 任务包 → 试运行修订</text><text x="145" y="523" font-size="24" font-weight="400" fill="#182a44">产物：指令、初始状态、验收器与引导</text><path d="M600,562 L600,594" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="55" y="600" width="1090" height="200" rx="18" fill="#fff2df" stroke="#dce4ee" stroke-width="2"/><text x="85" y="648" font-size="28" font-weight="650" fill="#526a88">03</text><text x="145" y="648" font-size="29" font-weight="650" fill="#182a44">Path-Steer  /  采集并筛选轨迹</text><text x="145" y="693" font-size="24" font-weight="400" fill="#182a44">任务级分工引导 → 混合动作 rollout</text><text x="145" y="728" font-size="24" font-weight="400" fill="#182a44">评分器验收 → 保留 score ≥ 0.75 的轨迹</text><text x="145" y="763" font-size="24" font-weight="400" fill="#182a44">产物：观察、动作、返回结果与评分</text><path d="M600,803 L600,841" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="55" y="848" width="1090" height="125" rx="18" fill="#fff" stroke="#dce4ee" stroke-width="2"/><text x="90" y="895" font-size="29" font-weight="650" fill="#182a44">监督微调 Qwen3.5-9B</text><text x="90" y="940" font-size="24" font-weight="400" fill="#526a88">4,923 条轨迹 · 235,408 条步骤记录；评估时无任务级路径引导。</text></g></svg>