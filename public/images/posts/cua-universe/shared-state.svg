<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-label="共享状态的 GUI 与 CLI 交互模型"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" rx="24" fill="#f5f7fb"/><g font-family="system-ui,-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="52" y="68" font-size="34" font-weight="700" fill="#182a44">两个操作入口，一份任务状态</text><text x="52" y="111" font-size="23" font-weight="400" fill="#526a88">截图和命令返回，描述同一个项目的变化</text><rect x="420" y="163" width="360" height="105" rx="18" fill="#fff" stroke="#dce4ee" stroke-width="2"/><text x="515" y="226" font-size="28" font-weight="650" fill="#182a44">智能体选择动作</text><rect x="70" y="335" width="400" height="140" rx="18" fill="#eaf0ff" stroke="#cbd9f9" stroke-width="2"/><text x="100" y="385" font-size="27" font-weight="600" fill="#355dad">GUI：点击、输入、拖动</text><text x="100" y="435" font-size="23" font-weight="400" fill="#182a44">依据布局与可见界面操作</text><rect x="730" y="335" width="400" height="140" rx="18" fill="#e4f3ee" stroke="#b8dcd0" stroke-width="2"/><text x="760" y="385" font-size="27" font-weight="600" fill="#26775b">CLI：对象、参数、导出</text><text x="760" y="435" font-size="23" font-weight="400" fill="#182a44">返回退出码与结构化结果</text><path d="M475,269 L280,330" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M725,269 L920,330" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="280" y="555" width="640" height="110" rx="18" fill="#fff" stroke="#dce4ee" stroke-width="2"/><text x="343" y="602" font-size="29" font-weight="650" fill="#182a44">共享状态：原生文件 / 当前应用</text><text x="343" y="641" font-size="23" font-weight="400" fill="#182a44">外部编辑后，通过适配器同步 GUI 视图</text><path d="M275,477 L400,550" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M925,477 L800,550" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="52" y="738" font-size="23" font-weight="400" fill="#526a88">下一轮观察 = 当前截图 + 可选 CLI 反馈；避免用旧界面继续判断新状态。</text></g></svg>