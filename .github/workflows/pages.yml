name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, Linux, X64, aliyun]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: site
    env:
      # Keep install networking conservative on the persistent self-hosted runner.
      NODE_OPTIONS: --dns-result-order=ipv4first
      npm_config_store_dir: /var/cache/pnpm/store
      npm_config_registry: https://registry.npmmirror.com/
      npm_config_fetch_retries: "5"
      npm_config_fetch_retry_factor: "2"
      npm_config_fetch_retry_mintimeout: "2000"
      npm_config_fetch_retry_maxtimeout: "15000"
      npm_config_fetch_timeout: "120000"
      PLAYWRIGHT_BROWSERS_PATH: /var/cache/playwright
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Isolate this checkout from the runner's legacy root workspace,
          # which contains a dependency tree with incompatible ownership.
          path: site
          clean: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify persistent package stores
        run: |
          test -d "$npm_config_store_dir"
          test -d "$PLAYWRIGHT_BROWSERS_PATH"
          echo "pnpm store: $(pnpm store path --silent)"
          echo "Playwright browsers: $PLAYWRIGHT_BROWSERS_PATH"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Check
        run: pnpm check

      - name: Unit tests
        run: pnpm exec vitest run

      - name: Build
        run: pnpm build

      - name: Verify dist artifact
        run: pnpm verify:dist

      - name: Ensure Chromium is available
        shell: bash
        run: |
          set -euo pipefail
          expected="$(pnpm exec playwright install --dry-run chromium | awk -F': ' '/Install location:/ { path=$2; sub(/^[[:space:]]+/, "", path); sub(/[[:space:]]+$/, "", path); print path; exit }')"
          if [[ -n "${expected}" && -d "${expected}" ]]; then
            echo "Reusing preinstalled Chromium at ${expected}"
          else
            echo "Chromium is missing; installing it once"
            pnpm exec playwright install chromium
          fi

      - name: End-to-end smoke tests
        run: pnpm exec playwright test --workers=1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: [self-hosted, Linux, X64, aliyun]
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
