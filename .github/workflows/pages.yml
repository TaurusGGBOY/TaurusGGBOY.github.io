name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, Linux, X64, aliyun]
    env:
      # The runner's IPv6 path is unavailable and registry.npmjs.org is unstable
      # from this network. Keep the workaround scoped to this build job.
      NODE_OPTIONS: --dns-result-order=ipv4first
      npm_config_registry: https://registry.npmmirror.com/
      npm_config_fetch_retries: "5"
      npm_config_fetch_retry_factor: "2"
      npm_config_fetch_retry_mintimeout: "2000"
      npm_config_fetch_retry_maxtimeout: "15000"
      npm_config_fetch_timeout: "120000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The persistent runner keeps a dependency tree whose historical
          # ownership may prevent `git clean -ffdx` from removing it.
          clean: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
          run_install: false

      - name: Enable pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Check
        run: pnpm check

      - name: Unit tests
        run: pnpm exec vitest run

      - name: Build
        run: pnpm build

      - name: Verify dist artifact
        run: pnpm verify:dist

      - name: Ensure Chromium is available
        shell: bash
        run: |
          set -euo pipefail
          expected="$(pnpm exec playwright install --dry-run chromium | awk -F': ' '/Install location:/ { path=$2; sub(/^[[:space:]]+/, "", path); sub(/[[:space:]]+$/, "", path); print path; exit }')"
          if [[ -n "${expected}" && -d "${expected}" ]]; then
            echo "Reusing preinstalled Chromium at ${expected}"
          else
            echo "Chromium is missing; installing it once"
            pnpm exec playwright install chromium
          fi

      - name: End-to-end smoke tests
        run: pnpm exec playwright test --workers=1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: [self-hosted, Linux, X64, aliyun]
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
